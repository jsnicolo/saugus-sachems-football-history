name: Remove stale Pages blocker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-pages-blocker.yml']
permissions:
  contents: read
  deployments: write
jobs:
  remove-stale-record:
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the canceled deployment record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api 'repos/jsnicolo/saugus-sachems-football-history/deployments?sha=d0292c01f66c988700619c7602fd7e278340cd73&environment=github-pages&per_page=100' --jq '.[].id' > stale-deployments.txt
          while read -r deployment_id; do
            [ -n "$deployment_id" ] || continue
            gh api --method POST "repos/jsnicolo/saugus-sachems-football-history/deployments/$deployment_id/statuses" -f state=inactive -f description='Clearing canceled Pages deployment blocking publication' --silent
            gh api --method DELETE "repos/jsnicolo/saugus-sachems-football-history/deployments/$deployment_id"
            echo "Removed stale deployment record $deployment_id"
          done < stale-deployments.txt
