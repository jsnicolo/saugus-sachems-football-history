name: Import Globe gallery batch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-globe-gallery.yml']
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and import the six gallery clippings
        run: |
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          expected = '35394bd9ed2d550b1ba2abf3854820af04228a94'
          actual = subprocess.check_output(['git','hash-object','photos.json']).decode().strip()
          assert actual == expected, 'Gallery changed during upload; merge before publishing.'
          manifest = pathlib.Path('.gallery-upload-globe-1966-1911.json')
          batch = json.loads(manifest.read_text())
          assert len(batch['files']) == 12
          for item in batch['files']:
              target = pathlib.Path(item['path'])
              assert target.parent == pathlib.Path('gallery-assets/globe-1966-1911')
              assert target.suffix == '.webp'
              data = base64.b64decode(item['data'], validate=True)
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          pathlib.Path('photos.json').write_text(json.dumps(batch['photos'],ensure_ascii=False,indent=2)+'\n')
          manifest.unlink()
          pathlib.Path('.github/workflows/import-globe-gallery.yml').unlink()
          print('Validated and imported 12 image assets and six gallery entries.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- photos.json gallery-assets/globe-1966-1911 .gallery-upload-globe-1966-1911.json .github/workflows/import-globe-gallery.yml
          git commit -m 'Import six Boston Globe gallery clippings with year placement and captions'
          git push origin HEAD:main
